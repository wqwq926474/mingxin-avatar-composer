<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f36b21">
  <title>明心商学 · 头像合成器</title>
  <style>
    :root {
      --orange: #f36b21;
      --orange-deep: #d94f10;
      --ink: #29201b;
      --white: #fff;
      --soft: #fff6e9;
      --line: #f2b58d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: linear-gradient(160deg, #fff8ee 0%, #ffe4c4 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px max(30px, env(safe-area-inset-bottom));
    }

    .hero {
      text-align: center;
      padding: 12px 0 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--white);
      color: var(--orange-deep);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(218, 84, 18, .14);
    }

    .brand::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 4px rgba(243, 107, 33, .16);
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(24px, 6vw, 34px);
      letter-spacing: .03em;
      color: #7b2c0b;
    }

    .subtle {
      margin: 0;
      color: #8e5532;
      line-height: 1.7;
      font-size: 14px;
    }

    .card {
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(243, 107, 33, .18);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 42px rgba(145, 67, 26, .13);
    }

    .upload-zone {
      border: 2px dashed #f3a676;
      border-radius: 18px;
      padding: 30px 18px;
      text-align: center;
      background: #fffaf4;
      transition: border-color .2s ease, background .2s ease;
    }

    .upload-zone.dragover {
      border-color: var(--orange);
      background: #fff1e3;
    }

    .upload-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(145deg, #ffb163, #f36b21);
      color: var(--white);
      font-size: 27px;
      box-shadow: 0 10px 22px rgba(243, 107, 33, .26);
    }

    .upload-title {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 700;
    }

    .upload-desc {
      margin: 0 0 18px;
      color: #9b6b4d;
      font-size: 13px;
      line-height: 1.6;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      border-radius: 999px;
      min-height: 46px;
      padding: 12px 22px;
      font-weight: 700;
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn.primary {
      background: linear-gradient(145deg, #ff9e4c, #f36b21);
      color: var(--white);
      box-shadow: 0 10px 22px rgba(243, 107, 33, .28);
    }

    .btn.ghost {
      background: #fff2e4;
      color: #ad4c1b;
      border: 1px solid #f3c4a2;
    }

    .btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .hint {
      margin: 12px 2px 0;
      color: #aa7a5c;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .status {
      min-height: 20px;
      margin: 14px 2px 0;
      color: #a04d1a;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .progress {
      height: 7px;
      margin-top: 12px;
      border-radius: 999px;
      background: #ffe4cd;
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff9e4c, #f36b21);
      transition: width .18s ease;
    }

    .stage {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: var(--white);
      border: 1px solid rgba(243, 107, 33, .12);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5), 0 14px 30px rgba(145, 67, 26, .11);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-top: 16px;
      padding: 14px;
      border-radius: 16px;
      background: #fff8f1;
      border: 1px solid rgba(243, 107, 33, .12);
    }

    .control {
      display: grid;
      grid-template-columns: 52px 1fr 54px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      color: #8c4c28;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--orange);
    }

    output {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #b14715;
      font-weight: 700;
    }

    .small {
      min-height: 38px;
      padding: 8px 14px;
      font-size: 13px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    footer {
      margin-top: 22px;
      color: #ad7b5b;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 560px) {
      .actions {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">明心商学</div>
      <h1>金秋盛棠 · 头像合成器</h1>
      <p class="subtle">上传头像图片，自动抠出人像并合成到活动海报中。<br>图片全程只在你的手机或电脑浏览器内处理。</p>
    </header>

    <section id="uploadCard" class="card">
      <div id="uploadZone" class="upload-zone">
        <div class="upload-icon" aria-hidden="true">✦</div>
        <p class="upload-title">选择你的头像照片</p>
        <p class="upload-desc">建议使用背景干净、人物面部清晰的照片<br>支持相册或直接拍照</p>
        <div class="btn-row">
          <button id="pickBtn" class="btn primary" type="button">从相册选择</button>
          <button id="cameraBtn" class="btn ghost" type="button">拍照上传</button>
        </div>
      </div>
      <p class="hint">首次使用需要联网下载 AI 抠图模型，之后浏览器会缓存。</p>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="progressWrap" class="progress" hidden>
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </section>

    <section id="resultCard" class="card" hidden>
      <div class="stage">
        <canvas id="previewCanvas" width="1024" height="1024"></canvas>
      </div>

      <div class="controls">
        <div class="control">
          <span>大小</span>
          <input id="scaleSlider" type="range" min="60" max="150" step="1" value="100">
          <output id="scaleValue">100%</output>
        </div>
        <div class="control">
          <span>左右</span>
          <input id="xSlider" type="range" min="-240" max="240" step="1" value="0">
          <output id="xValue">0</output>
        </div>
        <div class="control">
          <span>上下</span>
          <input id="ySlider" type="range" min="-240" max="240" step="1" value="0">
          <output id="yValue">0</output>
        </div>
        <button id="resetBtn" class="btn ghost small" type="button">恢复自动位置</button>
      </div>

      <div class="actions">
        <button id="downloadBtn" class="btn primary" type="button">下载合成海报</button>
        <button id="againBtn" class="btn ghost" type="button">重新上传</button>
      </div>
    </section>

    <footer>
      模板海报仅用于展示与分享，请确认已获得相关素材授权。
    </footer>
  </main>

  <input id="fileInput" type="file" accept="image/*" hidden>
  <input id="cameraInput" type="file" accept="image/*" capture="user" hidden>

    const MODEL_URL = "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";
    const MODEL_CONFIG = {
      publicPath: "https://staticimgly.com/@imgly/background-removal-data/1.5.5/dist/",
      model: "medium",
      output: { format: "image/png", quality: 1 },
      progress: (key, current, total) => {
        const pct = total > 0 ? Math.min(100, Math.round(current / total * 100)) : 0;
        progressBar.style.width = `${pct}%`;
        const label = key === "fetch" ? "正在下载抠图模型" : key === "compute" ? "正在识别人物" : "正在合成";
        statusEl.textContent = total > 0 ? `${label}… ${pct}%` : `${label}…`;
      }
    };

    const $ = (id) => document.getElementById(id);
    const uploadCard = $("uploadCard");
    const uploadZone = $("uploadZone");
    const resultCard = $("resultCard");
    const statusEl = $("status");
    const progressWrap = $("progressWrap");
    const progressBar = $("progressBar");
    const fileInput = $("fileInput");
    const cameraInput = $("cameraInput");
    const pickBtn = $("pickBtn");
    const cameraBtn = $("cameraBtn");
    const downloadBtn = $("downloadBtn");
    const againBtn = $("againBtn");
    const resetBtn = $("resetBtn");
    const scaleSlider = $("scaleSlider");
    const xSlider = $("xSlider");
    const ySlider = $("ySlider");
    const scaleValue = $("scaleValue");
    const xValue = $("xValue");
    const yValue = $("yValue");
    const canvas = $("previewCanvas");
    const ctx = canvas.getContext("2d");

    const templateImg = new Image();
    const DEFAULT_STATE = { scale: 1, x: 0, y: 0 };
    let state = { ...DEFAULT_STATE };
    let cutoutImage = null;
    let subjectBox = null;
    let templateReady = false;
    let busy = false;

    templateImg.onload = () => {
      templateReady = true;
      render();
    };
    templateImg.onerror = () => {
      statusEl.textContent = "模板加载失败，请确认页面文件完整后再试。";
    };
    templateImg.src = TEMPLATE_DATA_URL;

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("图片无法读取，请换一张照片"));
        img.src = src;
      });
    }

    async function prepareAvatar(file) {
      const originalUrl = URL.createObjectURL(file);
      try {
        const img = await loadImage(originalUrl);
        const maxEdge = 1800;
        const ratio = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * ratio));
        const h = Math.max(1, Math.round(img.naturalHeight * ratio));
        const prep = document.createElement("canvas");
        prep.width = w;
        prep.height = h;
        const prepCtx = prep.getContext("2d");
        prepCtx.drawImage(img, 0, 0, w, h);
        return new Promise((resolve, reject) => {
          prep.toBlob((blob) => {
            blob ? resolve(blob) : reject(new Error("图片处理失败"));
          }, "image/png");
        });
      } finally {
        URL.revokeObjectURL(originalUrl);
      }
    }

    function findSubjectBox(img) {
      const probe = document.createElement("canvas");
      probe.width = img.naturalWidth;
      probe.height = img.naturalHeight;
      const probeCtx = probe.getContext("2d");
      probeCtx.drawImage(img, 0, 0);
      const data = probeCtx.getImageData(0, 0, probe.width, probe.height).data;
      let minX = probe.width;
      let minY = probe.height;
      let maxX = -1;
      let maxY = -1;
      const step = 2;
      for (let y = 0; y < probe.height; y += step) {
        for (let x = 0; x < probe.width; x += step) {
          const alpha = data[(y * probe.width + x) * 4 + 3];
          if (alpha > 16) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return null;
      return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
    }

    function render() {
      if (!templateReady) return;
      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(templateImg, 0, 0, width, height);
      if (!cutoutImage || !subjectBox) return;

      const safe = { x: 82, y: 35, w: 860, h: 748 };
      const baseScale = Math.min(safe.w / subjectBox.w, safe.h / subjectBox.h);
      const scale = baseScale * state.scale;
      const drawW = subjectBox.w * scale;
      const drawH = subjectBox.h * scale;
      const centerX = safe.x + safe.w / 2 + state.x;
      const centerY = safe.y + safe.h / 2 + state.y;
      const dx = centerX - drawW / 2;
      const dy = centerY - drawH / 2;

      ctx.save();
      ctx.beginPath();
      ctx.rect(safe.x - 12, safe.y - 6, safe.w + 24, safe.h + 12);
      ctx.clip();
      ctx.drawImage(
        cutoutImage,
        subjectBox.x,
        subjectBox.y,
        subjectBox.w,
        subjectBox.h,
        dx,
        dy,
        drawW,
        drawH
      );
      ctx.restore();

      drawTemplateOverlays(width, height);
    }

    function drawTemplateOverlays(width, height) {
      const overlays = [
        { x: 0, y: 784, w: width, h: height - 784 },
        { x: 0, y: 0, w: 396, h: 114 },
        { x: 916, y: 648, w: 108, h: height - 648 }
      ];
      overlays.forEach((area) => {
        ctx.save();
        ctx.beginPath();
        ctx.rect(area.x, area.y, area.w, area.h);
        ctx.clip();
        ctx.drawImage(templateImg, 0, 0, width, height);
        ctx.restore();
      });
    }

    function updateControls() {
      scaleValue.value = `${state.scale * 100}%`;
      xValue.value = String(state.x);
      yValue.value = String(state.y);
      scaleSlider.value = String(Math.round(state.scale * 100));
      xSlider.value = String(state.x);
      ySlider.value = String(state.y);
    }

    function resetState() {
      state = { ...DEFAULT_STATE };
      updateControls();
      render();
    }

    async function processImage(file) {
      if (!file || busy) return;
      if (!file.type.startsWith("image/") && !/\.(jpe?g|png|webp)$/i.test(file.name)) {
        statusEl.textContent = "请选择 JPG、PNG 或 WEBP 图片";
        return;
      }

      busy = true;
      pickBtn.disabled = true;
      cameraBtn.disabled = true;
      resultCard.hidden = true;
      progressWrap.hidden = false;
      progressBar.style.width = "0%";
      statusEl.textContent = "正在准备图片…";

      try {
        const prepared = await prepareAvatar(file);
        statusEl.textContent = "正在加载 AI 抠图模型（首次约几十 MB，请稍候）…";
        const module = await import(MODEL_URL);
        const cutoutBlob = await module.removeBackground(prepared, MODEL_CONFIG);
        const cutoutUrl = URL.createObjectURL(cutoutBlob);
        try {
          cutoutImage = await loadImage(cutoutUrl);
        } finally {
          URL.revokeObjectURL(cutoutUrl);
        }

        subjectBox = findSubjectBox(cutoutImage);
        if (!subjectBox) {
          throw new Error("没有识别到清晰人像，建议换一张人物占比较大的照片");
        }

        resetState();
        uploadCard.hidden = true;
        resultCard.hidden = false;
        statusEl.textContent = "合成完成。可拖动滑杆调整大小与位置。";
      } catch (error) {
        console.error(error);
        statusEl.textContent = `处理失败：${error.message}`;
      } finally {
        busy = false;
        progressWrap.hidden = true;
        pickBtn.disabled = false;
        cameraBtn.disabled = false;
      }
    }

    pickBtn.addEventListener("click", () => fileInput.click());
    cameraBtn.addEventListener("click", () => cameraInput.click());
    fileInput.addEventListener("change", (event) => processImage(event.target.files[0]));
    cameraInput.addEventListener("change", (event) => processImage(event.target.files[0]));

    ["dragenter", "dragover"].forEach((eventName) => {
      uploadZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        uploadZone.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach((eventName) => {
      uploadZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        uploadZone.classList.remove("dragover");
      });
    });
    uploadZone.addEventListener("drop", (event) => {
      processImage(event.dataTransfer.files[0]);
    });

    scaleSlider.addEventListener("input", (event) => {
      state.scale = Number(event.target.value) / 100;
      updateControls();
      render();
    });
    xSlider.addEventListener("input", (event) => {
      state.x = Number(event.target.value);
      updateControls();
      render();
    });
    ySlider.addEventListener("input", (event) => {
      state.y = Number(event.target.value);
      updateControls();
      render();
    });
    resetBtn.addEventListener("click", resetState);

    downloadBtn.addEventListener("click", () => {
      canvas.toBlob((blob) => {
        if (!blob) {
          statusEl.textContent = "导出失败，请重试或更换浏览器。";
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "明心商学-头像合成海报.jpg";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
      }, "image/jpeg", 0.94);
    });

    againBtn.addEventListener("click", () => {
      cutoutImage = null;
      subjectBox = null;
      resultCard.hidden = true;
      uploadCard.hidden = false;
      statusEl.textContent = "";
      progressWrap.hidden = true;
      fileInput.value = "";
      cameraInput.value = "";
    });

    updateControls();
  </script>
</body>
</html>
